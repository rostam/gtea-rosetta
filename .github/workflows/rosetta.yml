name: rosetta

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Run every implementation against the contract
        run: python3 harness/run.py
      - name: Fail if the implementations disagree
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open('docs/data/results.json'))
          bad = sum(v['disagreed'] for v in r['per_field'].values())
          print(f"{bad} disagreement(s)")
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: docs/data/results.json
